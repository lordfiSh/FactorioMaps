name: docker image

# A push to master or a release tag always builds, because that is what gets
# published. A pull request only builds when it touches something the image is
# made of — which is a small minority of them, and the rest were paying four
# and a half minutes of runner time for two architectures to prove that files
# they did not change still build. Everything else is checked in ci.yml.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
    paths:
      - "docker/**"
      - "requirements.txt"
      - "mozjpeg/**"
      - "updateLib.py"          # runs during the build, so it can break it
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

env:
  # ghcr requires a lowercase path, the repository name is mixed case
  IMAGE: ghcr.io/lordfish/factoriomaps

jobs:
  # Built on the architecture it targets rather than through emulation: the
  # image compiles wheels and installs a lot of apt, and qemu makes that
  # painfully slow. Each arch is smoke tested where it was built, which is how
  # the arm64 VirtualGL package mismatch surfaced in the first place.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}:ci

      - name: Smoke test
        # no factorio client here, so check what does not need one: the python
        # imports (turbojpeg has to load, and the bundled library is x86-64
        # only), auto.py starting, and the tools the entrypoint calls.
        run: |
          docker run --rm ${{ env.IMAGE }}:ci shell /opt/venv/bin/python -c "
          import sys; sys.path.insert(0, '/opt/factoriomaps')
          import zoom, crop, ref, progress
          print('imports ok, turbojpeg:', type(zoom.jpeg).__name__)"
          docker run --rm ${{ env.IMAGE }}:ci shell /opt/venv/bin/python /opt/factoriomaps/auto.py --help > /dev/null
          docker run --rm ${{ env.IMAGE }}:ci shell which gawk vglrun Xvfb > /dev/null
          echo "smoke test passed on ${{ matrix.platform }}"

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push this architecture by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Hand the digest to the merge job
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # the filename is the bare digest: artifact upload rejects the colon
          # in sha256:..., and the merge job puts the prefix back
          touch "/tmp/digests/${DIGEST#sha256:}"
          echo "pushed $DIGEST"
        shell: bash

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # One tag, both architectures: docker pull picks the right one.
  publish:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` only ever moves on a release tag — never on a branch push.
          # The branch tags move whenever somebody merges, which is the right
          # behaviour for a name that says which port it tracks and the wrong
          # one for a name that says nothing at all: an instance pulling
          # `latest` would otherwise take work in progress the moment it landed.
          # A release is the one moment somebody has decided the image is worth
          # handing out, so that is the only moment this follows.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Stitch the digests into one manifest per tag
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Say what landed
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }} \
            --format '{{range .Manifest.Manifests}}{{if .Platform.Architecture}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}{{end}}'
